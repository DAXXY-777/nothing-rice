# Font
$font = JetBrainsMono Nerd Font

# Colors
$accent        = #fc1930
$surface0      = #404040
$text          = #948282
$base          = #212736
$background    = #1d2230
$grey          = #808080

# GENERAL
general {
  hide_cursor = false
}

# BACKGROUND
background {
  monitor =
  path = /home/adhd/Downloads/wallpaper/2.jpg
  blur_passes = 1
  blur_size = 5
  noise = 0.2
  contrast = 0.9
  brightness = 0.5
  vibrancy = 0.9
  color = rgba(2, 0, 0, 0.9)
}

# TIME
label {
  monitor =
  text = $TIME12
  color = $grey
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $grey
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# USER AVATAR
image {
  monitor =
  path = $HOME/.face
  size = 100
  border_color = $accent
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 100, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = tue
  outer_color = $accent
  inner_color = rgba(0, 0, 0, 0.6)
  font_color = $accent
  fade_on_empty = false
  placeholder_text = Logged in as $USER
  hide_input = false
  check_color = $accent
  fail_color = $accent
  fail_text = <i>($FAIL) <b>($ATTEMPTS)</b></i>
  capslock_color = $accent
  position = 0, -90
  halign = center
  valign = center
}

# MEDIA CONTROLS
label {
  monitor =
  text = cmd[update:5000] playerctl metadata --format "{{ artist }} - {{ title }}"
  color = $text
  font_size = 20
  font_family = $font
  position = 0, 200
  halign = center
  valign = center
}
