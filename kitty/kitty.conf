kkfont_family      Nothing Font, Departure Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        12.0

# Opacity & Theme
background_opacity 0.7
background        #000000
foreground        #ffffff
cursor            #ff003c
cursor_text_color #000000
selection_foreground #ffffff
selection_background #ff003c

# Color Palette (Nothing-inspired)
color0  #000000
color1  #ff003c
color2  #777777
color3  #777777
color4  #777777
color5  #777777
color6  #777777
color7  #cccccc
color8  #444444
color9  #ff3366
color10 #aaaaaa
color11 #aaaaaa
color12 #aaaaaa
color13 #aaaaaa
color14 #aaaaaa
color15 #ffffff

# Visual & Sound
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no

# UI Cleanup
hide_window_decorations yes
window_border_width 0

# Padding
window_padding_width        12
single_window_padding_width -1

# Tab bar
tab_bar_style hidden
tab_bar_min_tabs 0

